name: mawidak
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # Navigation
  go_router: ^14.6.2

  # Dependency Injection
  get_it: ^8.0.2
  injectable: ^2.5.0

  # Networking
  dio: ^5.7.0

  # Local Storage
  hive_ce: ^2.11.3
  hive_ce_flutter: ^2.3.1

  # Environment Variables
  flutter_dotenv: ^5.2.1

  # Firebase
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

  # UI
  google_fonts: ^6.2.1

  # Functional Programming
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.13
  injectable_generator: ^2.6.2
  riverpod_generator: ^3.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  # Custom fonts
